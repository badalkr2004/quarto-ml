# Extensible multi-course learning site
# Add a new lecture series: see docs/adding-a-course.qmd

project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "courses/**/*.qmd"
    - "courses/**/*.ipynb"
    - "docs/**/*.qmd"
    - "!templates/**"
    - "!_math_test.qmd"

website:
  title: "Learn ML"
  description: "Lecture notes, tutorials, and references — ML and hands-on engineering courses"
  search:
    location: navbar
    type: overlay
  page-navigation: true
  reader-mode: true
  navbar:
    background: light
    left:
      - href: index.qmd
        text: Home
      - text: Courses
        menu:
          - text: All courses
            href: courses/index.qmd
          - text: "—"
          - text: Mathematical Foundations of ML
            href: courses/mfml/index.qmd
          - text: Spring Boot Full Course
            href: courses/springboot/index.qmd
          # - text: Next Series Title
          #   href: courses/SERIES_ID/index.qmd
      - href: references/index.qmd
        text: References
      - href: docs/adding-a-course.qmd
        text: Add a course
      - href: docs/attribution.qmd
        text: Attribution
    right:
      - icon: github
        href: https://github.com
        aria-label: GitHub
  page-footer:
    left: "Unofficial study notes · Not affiliated with NPTEL/IISc"
    right:
      - text: Attribution
        href: docs/attribution.qmd
  sidebar:
    - id: mfml
      title: "MFML (Prathosh)"
      style: docked
      search: true
      collapse-level: 2
      contents:
        - courses/mfml/index.qmd
        - section: "Lectures"
          contents:
            - courses/mfml/lectures/01-overview-of-function-approximation/notes.qmd
            - courses/mfml/lectures/01-overview-of-function-approximation/tutorial.ipynb
            - courses/mfml/lectures/01-overview-of-function-approximation/self-check-answers.qmd
            - courses/mfml/lectures/02-recap-probability-theory-1-part-1/notes.qmd
            - courses/mfml/lectures/02-recap-probability-theory-1-part-1/tutorial.ipynb
            - courses/mfml/lectures/02-recap-probability-theory-1-part-1/self-check-answers.qmd
            - courses/mfml/lectures/03-recap-probability-theory-1-part-2/notes.qmd
            - courses/mfml/lectures/03-recap-probability-theory-1-part-2/tutorial.ipynb
            - courses/mfml/lectures/03-recap-probability-theory-1-part-2/self-check-answers.qmd
            - courses/mfml/lectures/04-recap-probability-theory-1-part-3/notes.qmd
            - courses/mfml/lectures/04-recap-probability-theory-1-part-3/tutorial.ipynb
            - courses/mfml/lectures/04-recap-probability-theory-1-part-3/self-check-answers.qmd
            # - courses/mfml/lectures/05-.../notes.qmd
        - courses/mfml/references.qmd
    - id: springboot
      title: "Spring Boot (Coder Army)"
      style: docked
      search: true
      collapse-level: 2
      contents:
        - courses/springboot/index.qmd
        - section: "Lectures"
          contents:
            - courses/springboot/lectures/01-spring-framework-intro/notes.qmd
            - courses/springboot/lectures/01-spring-framework-intro/self-check-answers.qmd
            - courses/springboot/lectures/02-first-spring-boot-app/notes.qmd
            - courses/springboot/lectures/02-first-spring-boot-app/self-check-answers.qmd
            - courses/springboot/lectures/03-apache-maven/notes.qmd
            - courses/springboot/lectures/03-apache-maven/self-check-answers.qmd
            - courses/springboot/lectures/04-dependency-injection-ioc/notes.qmd
            - courses/springboot/lectures/04-dependency-injection-ioc/self-check-answers.qmd
            - courses/springboot/lectures/05-spring-ioc-container/notes.qmd
            - courses/springboot/lectures/05-spring-ioc-container/self-check-answers.qmd
            - courses/springboot/lectures/06-circular-dependency-bean-scope/notes.qmd
            - courses/springboot/lectures/06-circular-dependency-bean-scope/self-check-answers.qmd
        - courses/springboot/references.qmd
    # --- Paste a new sidebar block when you add a series ---
    # - id: SERIES_ID
    #   title: "Short Series Name"
    #   style: docked
    #   search: true
    #   contents:
    #     - courses/SERIES_ID/index.qmd
    #     - section: "Lectures"
    #       contents:
    #         - courses/SERIES_ID/lectures/01-.../notes.qmd
    #     - courses/SERIES_ID/references.qmd
    - id: references
      title: "References"
      style: docked
      contents:
        - references/index.qmd
    - id: docs
      title: "Site docs"
      style: docked
      contents:
        - docs/adding-a-course.qmd
        - docs/attribution.qmd

format:
  html:
    theme:
      - cosmo
      - styles.scss
    toc: true
    toc-depth: 3
    code-copy: true
    code-overflow: wrap
    link-external-newwindow: true
    # MathJax is more reliable for website + Connect Cloud than KaTeX here
    html-math-method: mathjax

execute:
  freeze: auto
  warning: false
