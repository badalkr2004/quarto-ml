format:
  html:
    theme:
      - cosmo
      - styles.scss
    toc: true
    toc-depth: 3
    code-copy: true
    code-overflow: wrap
    link-external-newwindow: true
    # MathJax is more reliable for website + Connect Cloud than KaTeX here
    html-math-method: mathjax

execute:
  freeze: auto
  warning: false
